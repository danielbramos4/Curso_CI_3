
name: Docker

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker:
    name: Publicar imagem Docker
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v7

      - name: Download do artefato
        uses: actions/download-artifact@v8
        with:
          name: programa
          path: .

      - name: Verificar arquivos
        run: |
          test -f main
          test -f Dockerfile
          test -d templates
          test -d assets
          ls -lh main

      - name: Validar credenciais Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Credenciais Docker Hub ausentes"
            exit 1
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            danielbramos/curso_ci_3:latest
            danielbramos/curso_ci_3:${{ github.sha }}
